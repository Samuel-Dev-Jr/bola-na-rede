# Configuração do deploy no Render, para o serviço nascer igual toda vez em vez
# de depender de alguém lembrar o que preencheu no painel.
#
# LEIA ANTES DE SUBIR:
#
# O plano gratuito NÃO tem disco persistente. O banco é um arquivo e é apagado a
# cada reinício, então o startCommand reconstrói a base de demonstração. Tudo que
# for digitado na instância hospedada se perde no próximo reinício.
#
# Por isso esta instância é VITRINE, não uso real. Ela sobe com 62 pessoas
# fictícias. O caderno real do Centro nunca entra aqui: dado de criança fica na
# rede local, onde as escolhas de segurança da seção 4 do DECISOES.md fazem
# sentido.
#
# A instância gratuita também hiberna depois de uns 15 minutos sem acesso e leva
# perto de um minuto pra acordar. Antes de apresentar, abra o link uma vez.

services:
  - type: web
    name: bola-na-rede
    runtime: python
    plan: free
    region: oregon

    # O código do sistema fica na pasta sistema/ do repositório.
    rootDir: sistema

    buildCommand: pip install -r requirements.txt

    # Reconstrói a base e sobe o servidor. O gunicorn precisa do --bind porque o
    # padrão dele é a porta 8000, e o Render entrega a porta em $PORT.
    startCommand: python preparar_deploy.py && gunicorn app:app --bind 0.0.0.0:$PORT

    envVars:
      # Assina o cookie de sessão. O generateValue faz o Render sortear uma e
      # guardar — melhor que eu escolher, e melhor que ficar no código.
      # Consequência: a chave muda em cada deploy, então todo mundo é
      # desconectado quando você publica de novo. Para uma vitrine, tudo bem.
      - key: CENTRO_CHAVE
        generateValue: true

      - key: ADMIN_LOGIN
        value: coordenacao

      # Sem valor aqui de propósito: o Render vai pedir na primeira publicação.
      # Senha de administrador escrita em arquivo que vai pro GitHub é senha
      # pública.
      - key: ADMIN_SENHA
        sync: false

      # Conta de demonstração, com senha conhecida, pra qualquer um conseguir
      # ABRIR a vitrine e ver o sistema. Ela administra uma base inventada que
      # se apaga a cada reinício — ver criar_demo() no preparar_deploy.py, que
      # explica por que esta senha pode existir e a de cima não.
      # Pra desligar: troque para 0.
      - key: DEMO_ATIVA
        value: "1"

      - key: PYTHON_VERSION
        value: "3.13.4"
