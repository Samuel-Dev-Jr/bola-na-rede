<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bola na Rede">
  <!-- Marca para tamanho PEQUENO: cabeçalho (28px) e favicon (16-32px).
       É o miolo da bola ampliado. A bola inteira, com as costuras, está em
       icone-app.svg e vai para os ícones grandes do app instalado.
       Duas versões porque o padrão que faz uma bola parecer bola não sobrevive
       a 20px: virava um borrão branco com cisco escuro. -->
  <rect width="64" height="64" rx="14" fill="#0f7a3d"/>
  <circle cx="32" cy="32" r="21.5" fill="#ffffff"/>
  <polygon points="32.00,21.00 42.46,28.60 38.46,40.90 25.54,40.90 21.54,28.60" fill="#0a5c2e"/>
</svg>
