<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Bailarina em arabesque: apoiada numa perna, a outra estendida pra trás,
       um braço pra cima e outro pra frente. Tentei antes desenhar a sapatilha
       com a fita, que era o desenho mais óbvio, e ela virou um borrão de laços
       no tamanho do cartão. A pose resolve o que o objeto não resolvia — dá
       pra reconhecer de longe, que é o que o ícone precisa. -->
